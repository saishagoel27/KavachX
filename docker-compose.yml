services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kavachx
      POSTGRES_PASSWORD: kavachx
      POSTGRES_DB: kavachx
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kavachx"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
